services:
  callcast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: callcast-hub
    ports:
      - "5000:5000"
    volumes:
      - callcast-db-data:/app/backend
    restart: unless-stopped
    environment:
      - PORT=5000

volumes:
  callcast-db-data:
    driver: local
